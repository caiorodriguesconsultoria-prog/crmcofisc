name: "[PROPOSTO, não ativo] Backup do banco + Storage, cifrado e com manifesto"

# PROPOSTA — ver docs/audit/BRANCH_SYNC.md §§11-13 (Fase 00.2). Ainda não
# substitui backup-diario.yml nem roda em agenda nenhuma: só
# `workflow_dispatch` manual, pra Caio testar antes de decidir ativar.
# Não editar backup-diario.yml direto evita que esta mudança rode sozinha
# com segredos reais antes de alguém revisar.
#
# O que este workflow acrescenta ao backup-diario.yml existente:
#   1. Backup do Storage (bucket "andamento-anexos"), que hoje fica de fora
#      (achado em docs/audit/GAPS.md).
#   2. Manifesto SHA-256 dos componentes individuais (dump, storage) E do
#      artefato final cifrado — não só do pacote combinado.
#   3. Cifragem com `age` antes de subir pro Drive — só a chave PÚBLICA
#      fica no repositório (chave pública não é segredo); a privada fica
#      só com o Caio, offline, fora do GitHub inteiramente.
#   4. Retenção GFS (7 diários / 4 semanais / 3 mensais) em vez do corte
#      fixo de 90 dias — scripts/retencao_gfs.py — numa pasta do Drive e
#      com prefixo de nome ISOLADOS do backup-diario.yml existente (achado
#      de conflito corrigido em §13: os dois reusavam a mesma pasta e o
#      mesmo prefixo "backup-crmcofisc-", então a limpeza de 90 dias de um
#      apagaria os backups do outro e vice-versa).
#   5. Checagem de consistência entre os registros de anexos no banco
#      (andamento_anexos.caminho) e os arquivos baixados do Storage
#      (scripts/verifica_consistencia_anexos.py).
#   6. Exclusão de backups antigos só DEPOIS de confirmar que a nova cópia
#      chegou íntegra no Drive (scripts/sobe_e_verifica.py) — nunca antes.
#
# Avaliação de credencial de leitura exclusiva (pg_dump/consistência):
# proposta em scripts/sql/criar_role_leitura_backup.sql — pendente de Caio
# criar o role e o secret novo; até lá este workflow continua reutilizando
# SUPABASE_DB_URL (mesmo usado pelo backup-diario.yml), sem agravar o que
# já existe em produção.
#
# Avaliação de backup incremental (Storage) e franquia gratuita: o volume
# atual de anexos (bucket "andamento-anexos") é pequeno o bastante pra um
# download completo a cada execução não ser um problema de tempo/custo —
# incremental via rclone (comparando checksums antes de rebaixar) fica
# registrado como melhoria futura em docs/audit/BRANCH_SYNC.md §13, não
# implementada agora pra não adicionar complexidade sem benefício medido.
# Este workflow só dispara manualmente (workflow_dispatch), então o custo
# em minutos de Actions fica limitado a execuções de teste deliberadas,
# dentro da franquia gratuita de qualquer plano (os passos somados ficam
# bem abaixo dos limites mensais mesmo em repositório privado).
#
# Segredos NOVOS que este workflow precisa (nomes apenas, nenhum valor
# aqui ou em qualquer lugar do repositório):
#   AGE_PUBLIC_KEY                 - chave pública de cifragem (não é
#                                    segredo por natureza, mas documentada
#                                    como tal pra não depender de decisão
#                                    de onde guardar uma chave "pública só
#                                    nossa")
#   SUPABASE_URL                   - já conhecida (igual a
#                                    NEXT_PUBLIC_SUPABASE_URL do app)
#   SUPABASE_SERVICE_ROLE_KEY      - JÁ EXISTE como segredo do Vercel;
#                                    precisa ser adicionada TAMBÉM como
#                                    GitHub Secret (mesma chave, destino
#                                    novo) — não é uma chave nova a gerar
#   GOOGLE_DRIVE_FOLDER_ID_COMPLETO - pasta do Drive SEPARADA da usada por
#                                    backup-diario.yml (GOOGLE_DRIVE_FOLDER_ID),
#                                    pra isolar fisicamente a retenção GFS
#                                    da retenção de 90 dias existente

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backup-storage-proposto
  cancel-in-progress: false

jobs:
  backup-completo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Define identificador único da execução
        run: |
          data=$(date +%Y-%m-%d)
          dir="backup-${data}-${{ github.run_id }}"
          mkdir -p "$dir"
          echo "DATA=${data}" >> "$GITHUB_ENV"
          echo "DIR=${dir}" >> "$GITHUB_ENV"
          echo "PREFIXO=crmcofisc-completo-${data}" >> "$GITHUB_ENV"

      - name: Instala cliente do Postgres (versão 17, compatível com o banco)
        timeout-minutes: 5
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Instala age (cifragem)
        run: sudo apt-get install -y age

      - name: Configura Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instala dependências Python
        run: pip install --quiet google-api-python-client google-auth requests

      - name: Gera o dump do banco
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --format=custom --file="${DIR}/banco.dump"

      - name: Baixa o bucket "andamento-anexos" do Storage
        timeout-minutes: 10
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/backup_storage.py andamento-anexos "${DIR}/storage"

      - name: Confere consistência entre o banco e os anexos baixados
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/verifica_consistencia_anexos.py "${DIR}/storage"

      - name: Compacta o Storage separadamente (checksum individual)
        run: tar -czf "${DIR}/storage.tar.gz" -C "${DIR}/storage" .

      - name: Gera manifesto SHA-256 dos componentes individuais (dump + storage)
        run: python scripts/gerar_manifesto.py "${DIR}/banco.dump" "${DIR}/storage.tar.gz" > "${DIR}/manifesto-componentes.sha256"

      - name: Compacta banco + storage + manifesto num único pacote
        run: tar -czf "${PREFIXO}.tar.gz" -C "${DIR}" banco.dump storage.tar.gz manifesto-componentes.sha256

      - name: Cifra o pacote com age (chave pública só, privada fica com o Caio)
        env:
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
        run: age -r "$AGE_PUBLIC_KEY" -o "${PREFIXO}.tar.gz.age" "${PREFIXO}.tar.gz"

      - name: Gera manifesto SHA-256 do artefato cifrado final
        run: python scripts/gerar_manifesto.py "${PREFIXO}.tar.gz.age" > "${PREFIXO}.sha256"

      - name: Guarda como artefato do GitHub (redundância, 14 dias — Drive é a cópia com retenção GFS)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "${{ env.PREFIXO }}"
          path: |
            ${{ env.PREFIXO }}.tar.gz.age
            ${{ env.PREFIXO }}.sha256
          retention-days: 14

      - name: Sobe o artefato cifrado e verifica a integridade no Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python scripts/sobe_e_verifica.py "${PREFIXO}.tar.gz.age" "${{ secrets.GOOGLE_DRIVE_FOLDER_ID_COMPLETO }}"

      - name: Sobe o manifesto do artefato cifrado
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python scripts/sobe_e_verifica.py "${PREFIXO}.sha256" "${{ secrets.GOOGLE_DRIVE_FOLDER_ID_COMPLETO }}"

      - name: Aplica retenção GFS (7 diários / 4 semanais / 3 mensais) — só depois da verificação acima
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID_COMPLETO: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID_COMPLETO }}
        run: python scripts/retencao_gfs.py
