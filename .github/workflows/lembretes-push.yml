name: Lembrete de agendamentos (push)

on:
  schedule:
    # A cada 10 min — verifica quem tem agendamento/tarefa daqui 30 min e
    # dispara notificação push pra quem ativou. GitHub Actions pode atrasar
    # alguns minutos em horário de pico; a rota tem margem de ±5 min pra
    # compensar isso sem perder ou duplicar aviso.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Só chama uma URL própria via HTTPS — não precisa de acesso de escrita ao
# repositório.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Chama a rota de verificação de lembretes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail -X POST "https://crmcofisc.vercel.app/api/push/verificar-lembretes" \
            -H "x-cron-secret: $CRON_SECRET"
