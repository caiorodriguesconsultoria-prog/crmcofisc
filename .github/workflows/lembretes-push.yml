name: Lembrete de tarefas (push)

on:
  schedule:
    # 08:00 e 14:00 de Brasília (UTC-3, fixo o ano todo) = 11:00 e 17:00 UTC.
    # github.event.schedule diz qual dos dois disparou, pra mandar o período
    # certo pra rota — cada firing manda um push só, com as tarefas daquele
    # período que ainda não foram avisadas.
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      periodo:
        description: "Período a verificar (manha ou tarde)"
        required: true
        default: "manha"

# Só chama uma URL própria via HTTPS — não precisa de acesso de escrita ao
# repositório.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Decide o período pelo horário do cron que disparou
        id: periodo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "valor=${{ inputs.periodo }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then
            echo "valor=manha" >> "$GITHUB_OUTPUT"
          else
            echo "valor=tarde" >> "$GITHUB_OUTPUT"
          fi
      - name: Chama a rota de verificação de lembretes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail -X POST "https://crmcofisc.vercel.app/api/push/verificar-lembretes" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"periodo\": \"${{ steps.periodo.outputs.valor }}\"}"
